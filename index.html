<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Estudos</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#24354b;background:#f3f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:38px auto;padding:20px}.card{background:white;border:1px solid #dce9f4;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 5px 20px #dce8f355}h1{font-size:26px}h2{font-size:19px}input,textarea,select,button{font:inherit;border:1px solid #cbddeb;border-radius:10px;padding:12px}input,textarea,select{width:100%;margin:6px 0 14px}button{background:#bcdcf5;color:#173957;cursor:pointer;font-weight:600}button:hover{background:#a7d0f0}.danger{background:#f5dede}.muted{color:#60758b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.hide{display:none!important}#auth{max-width:420px;margin:12vh auto}.timer{font-size:46px;font-variant-numeric:tabular-nums;margin:16px 0}nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}ul{padding-left:20px}li{margin:10px 0}canvas{max-width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:20px}</style></head><body><main><section id="auth" class="card"><h1>Meu painel de estudos</h1><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button><p id="loginmsg" class="muted status" role="status"></p></form></section><section id="app" class="hide"><nav><h1>Painel de estudos</h1><button id="logout">Sair</button></nav><p id="sync" class="muted" role="status"></p><div class="grid"><section class="card"><h2>Cronômetro</h2><label>Matéria<select id="subject"><option>Programação</option><option>Inglês</option></select></label><div id="clock" class="timer">00:00:00</div><label>Observações<textarea id="notes" rows="3" placeholder="O que você estudou?"></textarea></label><div class="actions"><button id="start">Iniciar</button><button id="pause">Pausar</button><button id="save">Salvar sessão</button></div></section><section class="card"><h2>Cronograma</h2><form id="addtask"><label>Atividade<input id="task" required placeholder="Ex.: Revisar JavaScript"></label><label>Data<input id="date" type="date" required></label><button>Adicionar</button></form><ul id="tasks"></ul></section></div><div class="grid"><section class="card"><h2>Histórico</h2><ul id="history"></ul></section><section class="card"><h2>Evolução</h2><canvas id="chart" width="450" height="220" aria-label="Minutos estudados nos últimos sete dias" role="img"></canvas></section></div></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://mhqucfsshhmzrzukstlj.supabase.co';const KEY='sb_publishable_8R_M_Fr5QNNSIjPJZgjwVA_1G4I9tqS';const sb=createClient(URL,KEY);const $=id=>document.getElementById(id);let user=null,elapsed=0,running=false,last=0,ticker=null,sessions=[],tasks=[];const pad=n=>String(n).padStart(2,'0');const fmt=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function key(t){return `estudos_${user.id}_${t}`};function localLoad(t){try{return JSON.parse(localStorage.getItem(key(t)))||[]}catch{return []}}function localSave(t,data){localStorage.setItem(key(t),JSON.stringify(data))}function tick(){if(running){let now=Date.now();elapsed+=Math.floor((now-last)/1000);last=now} $('clock').textContent=fmt(elapsed)}function draw(){const ctx=$('chart').getContext('2d');ctx.clearRect(0,0,450,220);const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)});const vals=days.map(d=>sessions.filter(s=>s.date===d).reduce((n,s)=>n+s.seconds/60,0));const max=Math.max(30,...vals);days.forEach((d,i)=>{let x=20+i*61,h=145*vals[i]/max;ctx.fillStyle='#a8d2f0';ctx.fillRect(x,170-h,38,h);ctx.fillStyle='#60758b';ctx.font='12px sans-serif';ctx.fillText(d.slice(5),x,191);ctx.fillText(String(Math.round(vals[i])),x,165-h)});ctx.fillText('Minutos por dia',20,16)}function render(){ $('history').innerHTML=sessions.length?sessions.slice().reverse().map(s=>`<li>${safe(s.date)} · ${safe(s.subject)} · ${fmt(s.seconds)}${s.notes?' — '+safe(s.notes):''}</li>`).join(''):'<li class="muted">Nenhuma sessão registrada.</li>';$('tasks').innerHTML=tasks.length?tasks.map((t,i)=>`<li>${safe(t.date)} · ${safe(t.name)} <button data-del="${i}" class="danger" type="button">Excluir</button></li>`).join(''):'<li class="muted">Nenhuma atividade cadastrada.</li>';draw()}async function enter(u){user=u;$('auth').classList.add('hide');$('app').classList.remove('hide');sessions=localLoad('sessions');tasks=localLoad('tasks');render();$('sync').textContent='Cronograma salvo neste navegador. Verificando sincronização das sessões…';const {data,error}=await sb.from('sessoes_estudo').select('*').eq('user_id',u.id).order('created_at',{ascending:true});if(error){$('sync').textContent='Sessões salvas localmente neste navegador; sincronização com o banco ainda precisa ser validada.';return}if(data?.length){sessions=data.map(s=>({date:(s.inicio||s.created_at||new Date().toISOString()).slice(0,10),subject:s.materia||'Estudo',seconds:Number(s.duracao_segundos||0),notes:s.observacoes||''}));localSave('sessions',sessions);render()}$('sync').textContent='Conectado ao Supabase. Confira se os campos da tabela correspondem ao painel.'}async function authState(){const {data}=await sb.auth.getUser();if(data.user)enter(data.user)}$('login').onsubmit=async e=>{e.preventDefault();$('loginmsg').textContent='Entrando…';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginmsg').textContent='Não foi possível entrar: '+error.message;return}$('loginmsg').textContent='';enter(data.user)};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('start').onclick=()=>{if(!running){running=true;last=Date.now();ticker=setInterval(tick,250)}};$('pause').onclick=()=>{tick();running=false;clearInterval(ticker)};$('save').onclick=async()=>{tick();if(!elapsed){alert('Inicie o cronômetro antes de salvar.');return}let s={date:new Date().toISOString().slice(0,10),subject:$('subject').value,seconds:elapsed,notes:$('notes').value};sessions.push(s);localSave('sessions',sessions);render();running=false;clearInterval(ticker);elapsed=0;$('clock').textContent=fmt(0);$('notes').value='';const {error}=await sb.from('sessoes_estudo').insert({user_id:user.id,inicio:new Date(Date.now()-s.seconds*1000).toISOString(),fim:new Date().toISOString(),duracao_segundos:s.seconds,observacoes:s.notes});$('sync').textContent=error?'Sessão salva neste navegador. Não foi possível sincronizar: verifique as colunas do Supabase.':'Sessão salva no Supabase.'};$('addtask').onsubmit=e=>{e.preventDefault();tasks.push({name:$('task').value,date:$('date').value});localSave('tasks',tasks);$('addtask').reset();render()};$('tasks').onclick=e=>{let i=e.target.dataset.del;if(i!==undefined){tasks.splice(Number(i),1);localSave('tasks',tasks);render()}};authState();
</script></body></html>
