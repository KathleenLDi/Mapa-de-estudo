
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estudos</title>
<style>
:root {
  font-family: system-ui, Arial, sans-serif;
  color: #24354b;
  background: #f3f8fc;
  color-scheme: light;
  --cor: #bcdcf5;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1080px; margin: 20px auto; padding: 16px; }
.card {
  background: white;
  border: 1px solid #dce9f4;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 16px;
}
h1 { font-size: 25px; }
h2 { font-size: 19px; margin-top: 0; }
label { display: block; margin: 12px 0; }
input, textarea, select, button {
  font: inherit;
  border: 1px solid #cbddeb;
  border-radius: 9px;
  padding: 11px;
}
input:not([type="checkbox"]), textarea, select {
  width: 100%;
  margin-top: 6px;
  background: white;
  color: #24354b;
}
button {
  background: #bcdcf5;
  color: #173957;
  cursor: pointer;
  font-weight: 600;
}
button:hover { filter: brightness(.96); }
button.active { background: var(--cor); }
.danger { background: #f5dede; }
.small { padding: 6px 9px; }
.muted { color: #60758b; font-size: 14px; }
.hide { display: none !important; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.grid > .card { min-width: 0; }
@media(max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
}
#auth {
  max-width: 420px;
  margin: 10vh auto;
}
#auth h1 { text-align: center; }
.header {
  position: relative;
  text-align: center;
  padding: 8px 75px;
  margin-bottom: 18px;
}
.header h1 { margin: 0; }
#logout { position: absolute; right: 0; top: 0; }
.tabs, .actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
}
.tabs { margin-bottom: 18px; }
.timer {
  font-size: 42px;
  font-variant-numeric: tabular-nums;
  margin: 20px 0;
}
.task-list {
  max-height: 320px;
  overflow-y: auto;
  margin-top: 16px;
  padding-right: 8px;
}
.task-row, .history-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid #edf2f7;
}
.task-info, .history-info { flex: 1; min-width: 0; }
.task-done { text-decoration: line-through; color: #7c8b9a; }
.history-info strong { display: block; }
.subject-accent { border-top: 4px solid var(--cor); }
.color-picker {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 16px;
}
.color-picker input {
  width: 48px;
  height: 38px;
  padding: 3px;
}
canvas { max-width: 100%; }
.auth-switch {
  text-align: center;
  margin-top: 18px;
}
.auth-switch button {
  border: 0;
  background: transparent;
  color: #326b9d;
  text-decoration: underline;
}
.message { min-height: 22px; }
</style>
</head>
<body>
<main>

<section id="auth" class="card">
  <h1>Painel de Estudos</h1>

  <form id="loginForm">
    <label>E-mail
      <input id="email" type="email" required autocomplete="username">
    </label>
    <label>Senha
      <input id="password" type="password"
        required autocomplete="current-password">
    </label>
    <button type="submit" style="width:100%">Entrar</button>
    <div class="auth-switch">
      Não tem uma conta?
      <button type="button" id="showSignup">Criar conta</button>
    </div>
  </form>

  <form id="signupForm" class="hide">
    <label>Nome
      <input id="signupName" required maxlength="80">
    </label>
    <label>E-mail
      <input id="signupEmail" type="email" required>
    </label>
    <label>Senha
      <input id="signupPassword" type="password"
        required minlength="8" autocomplete="new-password">
    </label>
    <label>Confirmar senha
      <input id="signupConfirm" type="password"
        required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" style="width:100%">Criar minha conta</button>
    <div class="auth-switch">
      Já tem uma conta?
      <button type="button" id="showLogin">Entrar</button>
    </div>
  </form>

  <p id="authMessage" class="muted message" role="status"></p>
</section>

<section id="app" class="hide">
  <header class="header">
    <h1>Painel de Estudos</h1>
    <button id="logout">Sair</button>
  </header>

  <div id="tabs" class="tabs"></div>

  <div class="color-picker">
    <label for="subjectColor">Cor da matéria:</label>
    <input id="subjectColor" type="color" value="#bcdcf5">
  </div>

  <div class="grid">
    <section class="card subject-accent">
      <h2>Cronograma</h2>
      <form id="taskForm">
        <label>Conteúdo / atividade
          <input id="taskTitle" list="suggestions"
            placeholder="Escolha ou digite um conteúdo" required>
          <datalist id="suggestions"></datalist>
        </label>
        <label>Data de início
          <input id="taskStart" type="date" required>
        </label>
        <label>Data final
          <input id="taskEnd" type="date" required>
        </label>
        <button type="submit">Adicionar atividade</button>
      </form>
      <div id="tasks" class="task-list"></div>
    </section>

    <section class="card subject-accent">
      <h2>Cronômetro</h2>
      <p id="currentSubject" class="muted"></p>
      <label>Atividade estudada
        <select id="studyTask"></select>
      </label>
      <div id="clock" class="timer">00:00:00</div>
      <label>Observações
        <textarea id="notes" rows="3"
          placeholder="O que você aprendeu?"></textarea>
      </label>
      <div class="actions">
        <button id="start" type="button">Iniciar</button>
        <button id="pause" type="button">Pausar</button>
        <button id="save" type="button">Salvar sessão</button>
      </div>
      <p id="saveMessage" class="muted" role="status"></p>
    </section>
  </div>

  <div class="grid">
    <section class="card subject-accent">
      <h2>Histórico</h2>
      <div id="history"></div>
    </section>
    <section class="card subject-accent">
      <h2>Evolução</h2>
      <canvas id="chart" width="450" height="220"></canvas>
    </section>
  </div>
</section>
</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient(
  'https://mhqucfsshhmzrzukstlj.supabase.co',
  'sb_publishable_8R_M_Fr5QNNSIjPJZgjwVA_1G4I9tqS'
);

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

let user = null;
let subjects = ['Programação', 'Inglês'];
let subject = 'Programação';
let colors = {
  'Programação': '#bcdcf5',
  'Inglês': '#c8e6d0'
};
let tasks = [];
let sessions = [];
let elapsed = 0;
let running = false;
let startedAt = 0;
let timerInterval = null;
let activeTaskId = '';

const suggestions = {
  'Programação': [
    'Introdução à lógica de programação',
    'Algoritmos e pseudocódigo',
    'Variáveis e tipos de dados',
    'Operadores e expressões',
    'Estruturas condicionais',
    'Estruturas de repetição',
    'Funções',
    'Listas e dicionários em Python',
    'Git e GitHub',
    'Automação com Python',
    'Pandas e análise de dados',
    'SQL e bancos de dados',
    'Fundamentos de IA',
    'IA aplicada e APIs',
    'Projeto final'
  ],
  'Inglês': [
    'Alfabeto e pronúncia',
    'Cumprimentos e apresentações',
    'Vocabulário do cotidiano',
    'Listening',
    'Shadowing',
    'Perguntas e respostas',
    'Conversação guiada',
    'Rotina e hábitos',
    'Passado e futuro',
    'Conversação espontânea'
  ]
};

function uid() {
  return crypto.randomUUID();
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return [
    Math.floor(s / 3600),
    Math.floor(s % 3600 / 60),
    s % 60
  ].map(pad).join(':');
}

function formatDate(value) {
  if (!value) return '';
  const p = value.slice(0, 10).split('-');
  return p.length === 3
    ? `${p[2]}/${p[1]}/${p[0]}`
    : value;
}

function localDate(value = new Date()) {
  const d = new Date(value);
  return [
    d.getFullYear(),
    pad(d.getMonth() + 1),
    pad(d.getDate())
  ].join('-');
}

function safe(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]
  );
}

function key(name) {
  return `estudos_${user.id}_${name}`;
}

function load(name, fallback = []) {
  try {
    return JSON.parse(localStorage.getItem(key(name))) ?? fallback;
  } catch {
    return fallback;
  }
}

function store(name, value) {
  localStorage.setItem(key(name), JSON.stringify(value));
}

function message(text) {
  $('authMessage').textContent = text;
}

$('showSignup').onclick = () => {
  $('loginForm').classList.add('hide');
  $('signupForm').classList.remove('hide');
  message('');
};

$('showLogin').onclick = () => {
  $('signupForm').classList.add('hide');
  $('loginForm').classList.remove('hide');
  message('');
};

$('signupForm').onsubmit = async e => {
  e.preventDefault();

  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const password = $('signupPassword').value;

  if (password !== $('signupConfirm').value) {
    message('As senhas não são iguais.');
    return;
  }

  message('Criando conta...');

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      data: { nome: name }
    }
  });

  if (error) {
    message('Não foi possível cadastrar: ' + error.message);
    return;
  }

  if (data.session && data.user) {
    message('');
    await enter(data.user);
  } else {
    $('signupForm').reset();
    $('signupForm').classList.add('hide');
    $('loginForm').classList.remove('hide');
    message(
      'Confira seu e-mail para confirmar a conta. ' +
      'Depois, faça login.'
    );
  }
};

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  message('Entrando...');

  const { data, error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  if (error) {
    message('Não foi possível entrar: ' + error.message);
    return;
  }

  message('');
  await enter(data.user);
};

$('logout').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

function renderTabs() {
  $('tabs').innerHTML = '';

  subjects.forEach(name => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = name;
    button.classList.toggle('active', name === subject);
    button.style.background = name === subject
      ? colors[name] || '#bcdcf5'
      : '#edf3f8';
    button.onclick = () => selectSubject(name);
    $('tabs').appendChild(button);
  });

  const add = document.createElement('button');
  add.type = 'button';
  add.textContent = '+ Adicionar matéria';
  add.onclick = () => {
    if (running || elapsed > 0) {
      alert('Salve a sessão antes de trocar de matéria.');
      return;
    }

    const name = prompt('Nome da nova matéria:')?.trim();
    if (!name) return;

    if (subjects.some(
      s => s.toLowerCase() === name.toLowerCase()
    )) {
      alert('Essa matéria já existe.');
      return;
    }

    subjects.push(name);
    colors[name] = '#d7d5f5';
    store('subjects', subjects);
    store('colors', colors);
    selectSubject(name);
  };

  $('tabs').appendChild(add);
}

function selectSubject(name) {
  if (running || elapsed > 0) {
    alert('Salve a sessão antes de trocar de matéria.');
    return;
  }

  subject = name;
  activeTaskId = '';

  const color = colors[name] || '#bcdcf5';
  document.documentElement.style.setProperty('--cor', color);
  $('subjectColor').value = color;
  $('currentSubject').textContent = name;
  $('saveMessage').textContent = '';

  $('suggestions').innerHTML =
    (suggestions[name] || [])
      .map(v => `<option value="${safe(v)}">`)
      .join('');

  renderTabs();
  render();
}

$('subjectColor').oninput = e => {
  colors[subject] = e.target.value;
  store('colors', colors);
  document.documentElement.style.setProperty(
    '--cor', e.target.value
  );
  renderTabs();
  draw();
};

function renderTasks() {
  const filtered = tasks
    .filter(t => t.subject === subject)
    .sort((a, b) =>
      (a.start || '').localeCompare(b.start || '')
    );

  $('tasks').innerHTML = filtered.length
    ? filtered.map(t => `
      <div class="task-row">
        <input type="checkbox"
          data-check="${safe(t.id)}"
          ${t.done ? 'checked' : ''}>
        <div class="task-info">
          <div class="${t.done ? 'task-done' : ''}">
            ${safe(t.name)}
          </div>
          <div class="muted">
            ${formatDate(t.start)}
            até ${formatDate(t.end)}
          </div>
        </div>
        <button type="button" class="small danger"
          data-task-del="${safe(t.id)}">
          Excluir
        </button>
      </div>
    `).join('')
    : '<p class="muted">Nenhuma atividade cadastrada.</p>';

  const current = activeTaskId || $('studyTask').value;

  $('studyTask').innerHTML =
    '<option value="">Selecione uma atividade</option>' +
    filtered.filter(t => !t.done).map(t => `
      <option value="${safe(t.id)}">
        ${safe(t.name)}
      </option>
    `).join('');

  if (filtered.some(t => t.id === current && !t.done)) {
    $('studyTask').value = current;
  } else {
    activeTaskId = '';
  }
}

$('taskForm').onsubmit = e => {
  e.preventDefault();

  const start = $('taskStart').value;
  const end = $('taskEnd').value;

  if (end < start) {
    alert('A data final deve ser igual ou posterior à inicial.');
    return;
  }

  tasks.push({
    id: uid(),
    subject,
    name: $('taskTitle').value.trim(),
    start,
    end,
    done: false
  });

  store('tasks', tasks);
  $('taskForm').reset();
  render();
};

$('tasks').onchange = e => {
  const id = e.target.dataset.check;
  if (!id) return;

  const task = tasks.find(t => t.id === id);
  if (!task) return;

  task.done = e.target.checked;
  store('tasks', tasks);
  render();
};

$('tasks').onclick = e => {
  const button = e.target.closest('[data-task-del]');
  if (!button) return;

  const id = button.dataset.taskDel;

  if (!confirm('Excluir esta atividade?')) return;

  tasks = tasks.filter(t => t.id !== id);
  store('tasks', tasks);
  render();
};

function renderHistory() {
  const filtered = sessions
    .filter(s => s.subject === subject)
    .slice()
    .reverse();

  $('history').innerHTML = filtered.length
    ? filtered.map(s => `
      <div class="history-item">
        <div class="history-info">
          <strong>${safe(s.content)}</strong>
          <div class="muted">
            ${formatDate(s.date)} · ${fmt(s.seconds)}
          </div>
          ${s.notes ? `<p>${safe(s.notes)}</p>` : ''}
        </div>
        <button type="button" class="small danger"
          data-session-del="${safe(s.id)}">
          Excluir
        </button>
      </div>
    `).join('')
    : '<p class="muted">Nenhuma sessão registrada.</p>';
}

$('history').onclick = e => {
  const button = e.target.closest('[data-session-del]');
  if (!button) return;

  if (!confirm('Excluir esta sessão?')) return;

  const id = button.dataset.sessionDel;
  sessions = sessions.filter(s => s.id !== id);
  store('sessions', sessions);
  render();
};

function draw() {
  const ctx = $('chart').getContext('2d');
  ctx.clearRect(0, 0, 450, 220);

  const filtered = sessions.filter(
    s => s.subject === subject
  );

  const days = [...new Set(
    filtered.map(s => s.date)
  )].sort().slice(-7);

  ctx.fillStyle = '#60758b';
  ctx.font = '14px sans-serif';

  if (!days.length) {
    ctx.fillText('Nenhum estudo registrado ainda.', 20, 100);
    return;
  }

  const values = days.map(date =>
    filtered.filter(s => s.date === date)
      .reduce((sum, s) =>
        sum + Number(s.seconds || 0) / 60, 0
      )
  );

  const max = Math.max(1, ...values);
  const slot = 420 / days.length;

  ctx.fillText('Minutos estudados', 20, 18);

  days.forEach((date, i) => {
    const x = 20 + i * slot;
    const height = 135 * values[i] / max;

    ctx.fillStyle = colors[subject] || '#a8d2f0';
    ctx.fillRect(
      x, 170 - height,
      Math.min(38, slot - 10),
      height
    );

    ctx.fillStyle = '#60758b';
    ctx.font = '12px sans-serif';
    ctx.fillText(formatDate(date).slice(0, 5), x, 192);
    ctx.fillText(
      String(Math.round(values[i])),
      x, 162 - height
    );
  });
}

function render() {
  renderTasks();
  renderHistory();
  draw();
}

function tick() {
  if (running) {
    const now = Date.now();
    const delta = Math.floor((now - startedAt) / 1000);
    elapsed += delta;
    startedAt += delta * 1000;
  }
  $('clock').textContent = fmt(elapsed);
}

$('studyTask').onchange = () => {
  if (!running && elapsed === 0) {
    activeTaskId = $('studyTask').value;
  }
};

$('start').onclick = () => {
  if (running) return;

  if (!activeTaskId) {
    activeTaskId = $('studyTask').value;
  }

  if (!tasks.some(
    t => t.id === activeTaskId && !t.done
  )) {
    alert('Selecione uma atividade pendente.');
    return;
  }

  running = true;
  startedAt = Date.now();
  timerInterval = setInterval(tick, 250);
};

$('pause').onclick = () => {
  tick();
  running = false;
  clearInterval(timerInterval);
};

$('save').onclick = async () => {
  tick();

  if (!elapsed) {
    alert('Inicie o cronômetro antes de salvar.');
    return;
  }

  const task = tasks.find(t => t.id === activeTaskId);

  if (!task) {
    alert('Selecione uma atividade.');
    return;
  }

  running = false;
  clearInterval(timerInterval);

  const seconds = elapsed;
  const notes = $('notes').value.trim();
  const end = new Date();

  const session = {
    id: uid(),
    date: localDate(),
    subject,
    content: task.name,
    seconds,
    notes
  };

  sessions.push(session);
  store('sessions', sessions);

  task.done = true;
  store('tasks', tasks);

  elapsed = 0;
  activeTaskId = '';
  $('clock').textContent = fmt(0);
  $('notes').value = '';
  $('saveMessage').textContent = 'Sessão salva.';
  render();

  const { error } = await sb
    .from('sessoes_estudo')
    .insert({
      user_id: user.id,
      inicio: new Date(
        end.getTime() - seconds * 1000
      ).toISOString(),
      fim: end.toISOString(),
      duracao_segundos: seconds,
      observacoes: notes
    });

  if (error) {
    console.warn('Erro de sincronização:', error);
    $('saveMessage').textContent =
      'Salvo neste navegador. Sincronização pendente.';
  }
};

async function enter(u) {
  user = u;

  subjects = load('subjects', ['Programação', 'Inglês']);
  colors = load('colors', colors);

  tasks = load('tasks').map(t => ({
    ...t,
    id: t.id || uid(),
    subject: t.subject || 'Programação',
    start: t.start || t.date || '',
    end: t.end || t.date || '',
    done: Boolean(t.done)
  }));

  sessions = load('sessions').map(s => ({
    ...s,
    id: s.id || uid()
  }));

  $('auth').classList.add('hide');
  $('app').classList.remove('hide');

  selectSubject('Programação');
}

async function authState() {
  const { data } = await sb.auth.getUser();
  if (data.user) await enter(data.user);
}

authState();
</script>
</body>
</html>
