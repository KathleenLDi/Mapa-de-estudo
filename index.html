
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Estudos</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
<main>

  <section id="auth" class="card">
    <h1>Painel de Estudos</h1>

    <form id="loginForm">
      <label>
        E-mail
        <input id="email" type="email"
          autocomplete="username" required>
      </label>

      <label>
        Senha
        <input id="password" type="password"
          autocomplete="current-password" required>
      </label>

      <button type="submit" style="width:100%">
        Entrar
      </button>

      <div class="auth-switch">
        Não tem uma conta?
        <button type="button" id="showSignup">
          Criar conta
        </button>
      </div>
    </form>

    <form id="signupForm" class="hide">
      <label>
        Nome
        <input id="signupName" required maxlength="80">
      </label>

      <label>
        E-mail
        <input id="signupEmail" type="email" required>
      </label>

      <label>
        Senha
        <input id="signupPassword" type="password"
          minlength="8" autocomplete="new-password" required>
      </label>

      <label>
        Confirmar senha
        <input id="signupConfirm" type="password"
          minlength="8" autocomplete="new-password" required>
      </label>

      <button type="submit" style="width:100%">
        Criar minha conta
      </button>

      <div class="auth-switch">
        Já tem uma conta?
        <button type="button" id="showLogin">
          Entrar
        </button>
      </div>
    </form>

    <p id="authMessage" class="muted message" role="status"></p>
  </section>

  <section id="app" class="hide">

    <header class="header">
      <h1>Painel de Estudos</h1>
      <button id="logout" type="button">Sair</button>
    </header>

    <div id="tabs" class="tabs"></div>

    <p id="appMessage" class="muted" role="status"></p>

    <div class="grid">

      <section class="card subject-accent">
        <h2>Cronograma</h2>

        <form id="taskForm">
          <label>
            Conteúdo / atividade
            <input id="taskTitle"
              list="suggestions"
              placeholder="Escolha ou digite um conteúdo"
              required>
            <datalist id="suggestions"></datalist>
          </label>

          <label>
            Data de início
            <input id="taskStart" type="date" required>
          </label>

          <label>
            Data final
            <input id="taskEnd" type="date" required>
          </label>

          <button type="submit">
            Adicionar atividade
          </button>
        </form>

        <div id="tasks" class="task-list"></div>
      </section>

      <section class="card subject-accent">
        <h2>Cronômetro</h2>

        <p id="currentSubject" class="muted"></p>

        <label>
          Atividade estudada
          <select id="studyTask"></select>
        </label>

        <div id="clock" class="timer">00:00:00</div>

        <label>
          Observações
          <textarea id="notes" rows="3"
            placeholder="O que você aprendeu?"></textarea>
        </label>

        <div class="actions">
          <button id="start" type="button">Iniciar</button>
          <button id="pause" type="button">Pausar</button>
          <button id="save" type="button">Salvar sessão</button>
        </div>

        <p id="saveMessage" class="muted" role="status"></p>
      </section>

    </div>

    <div class="grid">

      <section class="card subject-accent">
        <h2>Histórico</h2>
        <div id="history"></div>
      </section>

      <section class="card subject-accent">
        <h2>Evolução</h2>
        <canvas id="chart" width="450" height="220"
          aria-label="Minutos estudados por dia"></canvas>
      </section>

    </div>

  </section>

</main>

<script type="module" src="./js/app.js?v=3"></script>
</body>
</html>
